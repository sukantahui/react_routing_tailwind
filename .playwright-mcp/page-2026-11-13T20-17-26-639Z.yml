                  - paragraph [ref=e613]: "Whenever you tackle an Encoder question in your ISC examination, remember the 'Compression Principle'. An encoder is an information squeezer: it takes 4 or 8 individual wires and squeezes them into a compact binary address using OR gates. The most common pitfall I see in Barrackpore board prep papers is students forgetting that only ONE wire can be active at a time! If two wires are pressed at once, standard encoders get confused—which is exactly why Priority Encoders were invented. Practice drawing the 4-to-2 circuit until you can sketch it with proper OR gates and junction dots in under 90 seconds!"
