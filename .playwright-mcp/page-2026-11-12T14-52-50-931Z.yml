                      - code [ref=e442]: ('0000011')
                  - generic [ref=e443]: 0 = Working · 1 = Non-Working
                - generic [ref=e444]:
                  - paragraph [ref=e445]:
                    - text: In classic Excel,
                    - code [ref=e446]: NETWORKDAYS(start, end, [holidays])
                    - text: has a
                    - strong [ref=e447]: permanently hardcoded weekend definition
                    - text: ": Saturday and Sunday are always non-working days."
                  - paragraph [ref=e448]:
                    - text: To support global enterprise supply chains and diverse labor schedules, Excel introduced the
                    - strong [ref=e449]: 7-character binary weekend string mask
                    - text: . In this system, exactly 7 digits represent
                    - strong [ref=e450]: Monday through Sunday in sequential order
                    - text: . A
                    - code [ref=e451]: "0"
                    - text: indicates an operational working day, while a
                    - code [ref=e452]: "1"
                    - text: marks a non-working weekend day.
                  - paragraph [ref=e453]:
                    - text: 💡
                    - strong [ref=e454]: "Core Architectural Fact:"
                    - text: Calling
                    - code [ref=e455]: =NETWORKDAYS(A1, B1, Holidays)
                    - text: is 100% mathematically and computationally identical to writing
                    - code [ref=e456]: =NETWORKDAYS.INTL(A1, B1, "0000011", Holidays)
                    - text: . The string
                    - code [ref=e457]: "'0000011'"
                    - text: explicitly defines Monday through Friday as working days (five zeros) and Saturday and Sunday as non-working days (two ones).
