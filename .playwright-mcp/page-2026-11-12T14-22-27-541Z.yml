                - generic [ref=f4e669]:
                  - generic [ref=f4e670]:
                    - text: "Step 1: Understand Excel's 64-Bit Serial Storage"
                    - paragraph [ref=f4e671]: Excel stores dates as whole integers starting with 1 = Jan 1, 1900. Times are stored as decimals from 0.00000 to 0.99999 representing the portion of the 24-hour cycle.
                    - generic [ref=f4e672]: NOW() -> 46338.75 = 12-Nov-2026 at 6:00:00 PM
                  - generic [ref=f4e673]:
                    - text: "Step 2: Isolate the Date Portion"
                    - paragraph [ref=f4e674]: To strip off the fractional time and retain purely today's date serial, apply the INT() function or use TODAY().
                    - generic [ref=f4e675]: =INT(NOW()) equals =TODAY()
                  - generic [ref=f4e676]:
                    - text: "Step 3: Isolate the Time Portion"
                    - paragraph [ref=f4e677]: To extract the fractional time of day independent of the calendar date, use the MOD function with divisor 1.
                    - generic [ref=f4e678]: =MOD(NOW(), 1) -> Returns 0.75 for 6:00 PM
                  - generic [ref=f4e679]:
                    - text: "Step 4: Scale Elapsed Time into Practical Units"
                    - paragraph [ref=f4e680]: Subtracting two timestamps yields fractional days. Multiply by 24 for hours, 1,440 for minutes, or 86,400 for seconds.
                    - generic [ref=f4e681]: "Elapsed Hours: =(NOW() - StartTime) * 24 Elapsed Minutes: =(NOW() - StartTime) * 1440"
