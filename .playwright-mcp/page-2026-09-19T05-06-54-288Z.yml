                      - generic [ref=f1e549]: "public class SieveOfEratosthenesPrimeDemo {"
                      - generic [ref=f1e551]: // =========================================================================
                      - generic [ref=f1e552]: "// 1. STANDARD SIEVE OF ERATOSTHENES: O(N log(log N))"
                      - generic [ref=f1e553]: // =========================================================================
                      - generic [ref=f1e554]: "public static boolean[] generatePrimesSieve(int limit) {"
                      - generic [ref=f1e555]: if (limit < 2) return new boolean[0];
                      - generic [ref=f1e557]: boolean[] isPrime = new boolean[limit + 1];
                      - generic [ref=f1e558]: Arrays.fill(isPrime, true);
                      - generic [ref=f1e559]: isPrime[0] = false;
                      - generic [ref=f1e560]: isPrime[1] = false;
                      - generic [ref=f1e562]: // Outer loop runs up to sqrt(limit)
                      - generic [ref=f1e563]: "for (int p = 2; p * p <= limit; p++) {"
                      - generic [ref=f1e564]: "if (isPrime[p]) {"
                      - generic [ref=f1e565]: "// Inner loop marks multiples starting from p * p:"
                      - generic [ref=f1e566]: "for (int multiple = p * p; multiple <= limit; multiple += p) {"
                      - generic [ref=f1e567]: isPrime[multiple] = false;
                      - generic [ref=f1e568]: "}"
                      - generic [ref=f1e569]: "}"
                      - generic [ref=f1e570]: "}"
                      - generic [ref=f1e571]: return isPrime;
                      - generic [ref=f1e572]: "}"
                      - generic [ref=f1e574]: // =========================================================================
                      - generic [ref=f1e575]: // 2. MEMORY OPTIMIZED SIEVE USING BITSET (1 bit per number)
                      - generic [ref=f1e576]: // =========================================================================
                      - generic [ref=f1e577]: "public static BitSet generatePrimesBitSet(int limit) {"
                      - generic [ref=f1e578]: BitSet bitSet = new BitSet(limit + 1);
                      - generic [ref=f1e579]: bitSet.set(2, limit + 1); // Set bits 2 to limit to true
                      - generic [ref=f1e581]: "for (int p = 2; p * p <= limit; p = bitSet.nextSetBit(p + 1)) {"
                      - generic [ref=f1e582]: if (p == -1) break;
                      - generic [ref=f1e583]: "for (int multiple = p * p; multiple <= limit; multiple += p) {"
                      - generic [ref=f1e584]: bitSet.clear(multiple);
                      - generic [ref=f1e585]: "}"
                      - generic [ref=f1e586]: "}"
                      - generic [ref=f1e587]: return bitSet;
                      - generic [ref=f1e588]: "}"
                      - generic [ref=f1e590]: // =========================================================================
                      - generic [ref=f1e591]: // 3. NAIVE TRIAL DIVISION (For Performance Benchmark Comparison)
                      - generic [ref=f1e592]: // =========================================================================
                      - generic [ref=f1e593]: "public static boolean isPrimeTrialDivision(int n) {"
                      - generic [ref=f1e594]: if (n <= 1) return false;
                      - generic [ref=f1e595]: if (n <= 3) return true;
                      - generic [ref=f1e596]: if (n % 2 == 0 || n % 3 == 0) return false;
                      - generic [ref=f1e598]: "for (int i = 5; i * i <= n; i += 6) {"
                      - generic [ref=f1e599]: if (n % i == 0 || n % (i + 2) == 0) return false;
                      - generic [ref=f1e600]: "}"
                      - generic [ref=f1e601]: return true;
                      - generic [ref=f1e602]: "}"
